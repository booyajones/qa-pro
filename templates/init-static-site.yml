# qa-pro config — static-site / marketing / blog
name: REPLACE_ME
project_type: static-site
test_url: REPLACE_ME

pages:
  - /

viewports:
  - desktop  # 1440x900
  - mobile   # 390x844

a11y_rules: wcag22aa
visual_diff: true
data_adapter: none

monthly_token_cap: 2000000
per_run_token_cap: 500000
vision_call_cap_per_full: 30

masking:
  - selector: "[data-qa-mask]"
  - selector: "time, [datetime]"
  - selector: ".analytics-pixel"

report_dir: .qa/reports
